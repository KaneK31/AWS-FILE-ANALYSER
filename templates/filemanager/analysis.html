{% extends 'filemanager/base.html' %}

{% block title %}Analyze Files{% endblock %}

{% block content %}
    <h2 class="mb-3">📊 Select a File to Analyze</h2>
    <form method="post" action="{% url 'analyze_file' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="fileSelect" class="form-label">Choose a PDF file:</label>
            <select name="file_key" id="fileSelect" class="form-select">
                {% for file in files %}
                    <option value="{{ file }}">{{ file }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Analyze</button>
    </form>
{% endblock %}
