{% extends 'filemanager/base.html' %}

{% block title %}Column Analysis{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">📈 Analysis of "{{ column }}"</h2>
    <p><strong>From file:</strong> {{ filename }}</p>

    <table class="table table-bordered table-hover">
        <thead class="thead-dark">
            <tr>
                <th>Metric / Value</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody>
            {% for key, value in stats.items %}
            <tr>
                <td><strong>{{ key }}</strong></td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'analyze_file' %}" class="btn btn-primary mt-3">🔁 Analyze Another Column</a>
</div>
{% endblock %}
